<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>실시간 날씨</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>실시간 날씨</h1>

    <form id="search-form" class="search">
      <div class="combo">
        <input id="city-input" type="text" placeholder="지역 입력 (예: 제, 서울, 부산)" autocomplete="off" />
        <ul id="suggest" class="suggest" hidden></ul>
      </div>
      <button type="submit">검색</button>
      <button type="button" id="geo-btn" title="내 위치">📍</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section class="card">
      <div class="mapbar">
        <b>전국 현황</b>
        <span class="legend">높이 <b>기온</b> · 색 <b>PM2.5</b> · 라벨 <i class="lg">PM10</i> <i class="lg">PM2.5</i></span>
      </div>
      <div id="map"></div>
      <p class="hint">드래그로 회전, 휠로 확대/축소. 지역을 누르면 날씨·미세먼지를 봅니다.<br>
        미세먼지는 위성·모델 기반 <b>예측값</b>(Open-Meteo/CAMS)이며 측정소 실측값과 다를 수 있습니다.</p>
    </section>

    <section id="weather" class="card" hidden>
      <h2 id="place"></h2>
      <div class="current">
        <div id="icon" class="icon"></div>
        <div>
          <div id="temp" class="temp"></div>
          <div id="desc" class="desc"></div>
        </div>
      </div>
      <ul class="details">
        <li><span>체감온도</span><b id="feels"></b></li>
        <li><span>습도</span><b id="humidity"></b></li>
        <li><span>풍속</span><b id="wind"></b></li>
        <li><span>강수량</span><b id="precip"></b></li>
        <li><span>PM10</span><b id="pm10"></b></li>
        <li><span>PM2.5</span><b id="pm25"></b></li>
      </ul>
      <p id="updated" class="updated"></p>

      <h3>7일 예보</h3>
      <ul id="daily" class="daily"></ul>
    </section>
  </main>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
